<!--
  Template ref #cityInput grabs the raw input value at submit time.
  No FormsModule needed for this single field — keeps the bundle slim.
  Form `(ngSubmit)` lets the Enter key trigger the same handler as the button.
-->
<section class="search">
  <h1 class="search__logo">
    nim<span>bus</span>
  </h1>

  <p class="search__tagline">
    Enter a city to get the current weather &amp; 7-day forecast
  </p>

  <!--
    Using native (submit) with $event.preventDefault() because we don't
    import FormsModule. (ngSubmit) requires the NgForm directive, which
    only registers when FormsModule is imported. preventDefault stops
    the browser's native form submission (which would reload the page).
  -->
  <form class="search__form" (submit)="$event.preventDefault(); onSearch(cityInput.value)">
    <input
      #cityInput
      type="text"
      class="search__input"
      placeholder="e.g. London, Tokyo, Mumbai…"
      autocomplete="off"
      autofocus
    />
    <button type="submit" class="search__button" aria-label="Search">
      🔍
    </button>
  </form>

  @if (hasError()) {
    <p class="search__error">Please enter a city name.</p>
  }

  <p class="search__hint">Powered by Open Meteo — no API key required</p>
</section>
